name: ask-my-docs

services:
  backend:
    build:
      context: ../../apps/backend
      dockerfile: Dockerfile
    image: ask-my-docs-backend:latest
    container_name: ask-my-docs-backend
    restart: unless-stopped
    env_file: .env.prod
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.amd-backend.rule=Host(`${BACKEND_DOMAIN}`)"
      - "traefik.http.routers.amd-backend.entrypoints=websecure"
      - "traefik.http.routers.amd-backend.tls.certresolver=letsencrypt"
      - "traefik.http.services.amd-backend.loadbalancer.server.port=8000"

  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    image: ask-my-docs-frontend:latest
    container_name: ask-my-docs-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.amd-frontend.rule=Host(`${FRONTEND_DOMAIN}`)"
      - "traefik.http.routers.amd-frontend.entrypoints=websecure"
      - "traefik.http.routers.amd-frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.amd-frontend.loadbalancer.server.port=80"

networks:
  web:
    external: true
